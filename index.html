<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism AI</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#0b1220;
      --muted:#94a3b8;
      --primary:#6366f1;
      --accent:#06b6d4;
      --card:#111827;
      --radius:12px;
      --glass: rgba(255,255,255,0.03);
      --anim-speed: 1;
    }

    /* Reset & layout */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#app{height:100%}
    body{font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue";background: linear-gradient(180deg,var(--bg) 0%, #071022 100%);color:#e6eef8;display:flex}

    /* Animated background subtle gradient bands */
    .bg-band{position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.08;background:linear-gradient(90deg, rgba(99,102,241,.08), transparent 25%, rgba(6,182,212,.06), transparent 75%);filter:blur(60px);transform:translateZ(0);}

    /* App shell */
    .sidebar{width:300px;padding:18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);backdrop-filter: blur(6px);border-right:1px solid rgba(255,255,255,0.03)}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;box-shadow:0 8px 30px rgba(99,102,241,.12);transform-origin:center;animation:logo-bounce calc(6s * var(--anim-speed)) ease-in-out infinite}
    @keyframes logo-bounce{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}100%{transform:translateY(0) scale(1)}}

    .brand .title{font-weight:700;font-size:1.15rem}
    .actions{display:flex;gap:8px;align-items:center}

    .new-btn{padding:10px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--primary),#4f46e5);color:white;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(79,70,229,.12);transition:transform .18s ease,opacity .18s}
    .new-btn:hover{transform:translateY(-3px)}

    .thread-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px}
    .thread-item{padding:12px;border-radius:10px;background:var(--glass);cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:10px;transition:transform .18s,background .18s,box-shadow .18s;box-shadow: inset 0 -1px 0 rgba(255,255,255,0.02)}
    .thread-item:hover{transform:translateX(6px);background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));color:#e6eef8}
    .thread-item.active{background:linear-gradient(90deg, rgba(99,102,241,.12), rgba(6,182,212,.06));color:white;box-shadow:0 8px 24px rgba(6,182,212,.06)}

    /* Main chat area */
    .main{flex:1;display:flex;flex-direction:column}
    .header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .header .meta{display:flex;align-items:center;gap:10px}
    .controls{display:flex;gap:10px;align-items:center}

    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .messages{flex:1;padding:24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
    .message{max-width:72%;padding:12px 14px;border-radius:12px;line-height:1.4;animation:fadeUp .35s var(--anim-speed) both}
    .message.user{margin-left:auto;background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));color:var(--muted)}
    .message.assistant{margin-right:auto;background:linear-gradient(90deg,var(--primary),#4f46e5);color:white;box-shadow:0 10px 30px rgba(99,102,241,.08)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* Input */
    .input-box{padding:14px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,0.02);align-items:center;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}
    .input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;outline:none}
    .send{padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),#06b6d4);font-weight:700;color:#042237;cursor:pointer;box-shadow:0 8px 30px rgba(6,182,212,.08);transition:transform .12s}
    .send:active{transform:translateY(1px)}

    /* Floating settings */
    .settings-panel{position:fixed;right:22px;bottom:22px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:12px;border-radius:12px;box-shadow:0 12px 40px rgba(2,6,23,.6);border:1px solid rgba(255,255,255,0.03);backdrop-filter: blur(8px)}
    .settings-toggle{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px}
    .settings{display:none;min-width:260px;padding:10px;display:flex;flex-direction:column;gap:10px}
    .settings.open{display:flex}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

    /* compact mode */
    .compact .thread-item{padding:8px;border-radius:8px;font-size:.9rem}
    .compact .message{padding:8px;border-radius:8px}

    /* shimmer on thread titles */
    .thread-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .shimmer{background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 100%);background-size:200% 100%;animation:shimmer 3s linear infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* reduced motion respect */
    @media (prefers-reduced-motion: reduce){
      :root{--anim-speed: .0}
      *{animation:none !important;transition:none !important}
    }

    /* scroll styling */
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:10px}
  </style>
</head>
<body>
  <div class="bg-band"></div>
  <div class="sidebar">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <div class="title">Prism AI</div>
        <div style="font-size:12px;color:var(--muted)">Your creative assistant</div>
      </div>
    </div>

    <div class="actions">
      <button class="new-btn" onclick="createNewChat()">+ New Chat</button>
      <button class="settings-toggle" id="openSettings" title="Open settings">⚙️</button>
    </div>

    <div class="thread-list" id="threadList"></div>
  </div>

  <div class="main">
    <div class="header">
      <div class="meta">
        <div id="currentTitle" style="font-weight:700">New conversation</div>
        <div id="currentSubtitle" style="font-size:12px;color:var(--muted);margin-left:8px">Empty</div>
      </div>
      <div class="controls">
        <button class="settings-toggle" id="themeToggle">🌓</button>
        <button class="settings-toggle" id="compactToggle" title="Toggle compact mode">📏</button>
      </div>
    </div>

    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-box">
        <input id="userInput" class="input" placeholder="Ask Prism AI..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <button class="settings-toggle" id="closeSettings">✖️</button>
    <div class="settings" id="settings">
      <div style="font-weight:700">Settings</div>

      <div class="setting-row">
        <div style="font-size:13px;color:var(--muted)">Animations</div>
        <label><input type="checkbox" id="animToggle" checked /> Enable</label>
      </div>

      <div class="setting-row">
        <div style="font-size:13px;color:var(--muted)">Animation speed</div>
        <input type="range" id="animSpeed" min="0.25" max="2" step="0.05" value="1" />
      </div>

      <div class="setting-row">
        <div style="font-size:13px;color:var(--muted)">Compact UI</div>
        <label><input type="checkbox" id="compactUI" /> On</label>
      </div>

      <div class="setting-row">
        <div style="font-size:13px;color:var(--muted)">Theme</div>
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

    </div>
  </div>

  <script>
    const WORKER_URL = "https://prism-ai.koubik.workers.dev";
    let currentThreadId = null;
    let threads = [];

    /* --- UI helpers --- */
    function saveSettings(){
      const s = { anim: !!document.getElementById('animToggle').checked, speed: parseFloat(document.getElementById('animSpeed').value), compact: !!document.getElementById('compactUI').checked, theme: document.getElementById('themeSelect').value };
      localStorage.setItem('prism_settings', JSON.stringify(s));
      applySettings(s);
    }

    function loadSettings(){
      const raw = localStorage.getItem('prism_settings');
      const defaults = { anim:true, speed:1, compact:false, theme:'dark' };
      const s = raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
      document.getElementById('animToggle').checked = s.anim;
      document.getElementById('animSpeed').value = s.speed;
      document.getElementById('compactUI').checked = s.compact;
      document.getElementById('themeSelect').value = s.theme;
      applySettings(s);
    }

    function applySettings(s){
      document.documentElement.style.setProperty('--anim-speed', s.anim ? s.speed : 0);
      document.body.classList.toggle('compact', s.compact);

      // theme
      if(s.theme === 'light'){
        document.documentElement.style.setProperty('--bg','#f7fbff');
        document.documentElement.style.setProperty('--panel','#ffffff');
        document.documentElement.style.setProperty('--muted','#475569');
        document.documentElement.style.setProperty('--primary','#06b6d4');
        document.documentElement.style.setProperty('--accent','#7c3aed');
        document.documentElement.style.setProperty('--card','#ffffff');
        document.documentElement.style.setProperty('--glass','rgba(2,6,23,0.03)');
      } else {
        document.documentElement.style.setProperty('--bg','#0f172a');
        document.documentElement.style.setProperty('--panel','#0b1220');
        document.documentElement.style.setProperty('--muted','#94a3b8');
        document.documentElement.style.setProperty('--primary','#6366f1');
        document.documentElement.style.setProperty('--accent','#06b6d4');
        document.documentElement.style.setProperty('--card','#111827');
        document.documentElement.style.setProperty('--glass','rgba(255,255,255,0.03)');
      }
    }

    /* Settings panel controls */
    document.getElementById('openSettings').onclick = ()=>{ document.getElementById('settings').classList.add('open'); };
    document.getElementById('closeSettings').onclick = ()=>{ document.getElementById('settings').classList.remove('open'); };
    document.getElementById('animToggle').onchange = saveSettings;
    document.getElementById('animSpeed').oninput = saveSettings;
    document.getElementById('compactUI').onchange = saveSettings;
    document.getElementById('themeSelect').onchange = saveSettings;
    document.getElementById('themeToggle').onclick = ()=>{ const sel = document.getElementById('themeSelect'); sel.value = sel.value === 'dark' ? 'light' : 'dark'; saveSettings(); };
    document.getElementById('compactToggle').onclick = ()=>{ const cb = document.getElementById('compactUI'); cb.checked = !cb.checked; saveSettings(); };

    /* --- Threads / messages --- */
    async function init(){
      loadSettings();
      await loadThreads();
      if(!currentThreadId) await createNewChat();
    }

    async function loadThreads(){
      try{
        const res = await fetch(`${WORKER_URL}/api/threads`);
        threads = await res.json();
        const list = document.getElementById('threadList');
        list.innerHTML = '';
        threads.forEach((t)=>{
          const item = document.createElement('div');
          item.className = 'thread-item';
          if(currentThreadId === t.id) item.classList.add('active');
          const title = document.createElement('div');
          title.className = 'thread-title';
          title.textContent = t.title || 'Untitled';
          item.appendChild(title);
          item.onclick = ()=> selectThread(t.id);

          // subtle animated shimmer for new threads
          if(t.unread) title.classList.add('shimmer');

          list.appendChild(item);
        });
      }catch(e){ console.error('Error loading threads',e); }
    }

    async function createNewChat(){
      try{
        const res = await fetch(`${WORKER_URL}/api/threads/new`,{method:'POST'});
        const data = await res.json();
        currentThreadId = data.threadId;
        document.getElementById('messages').innerHTML = '';
        document.getElementById('currentTitle').textContent = 'New conversation';
        document.getElementById('currentSubtitle').textContent = 'Empty';
        await loadThreads();
      }catch(e){ console.error('Error creating chat',e); }
    }

    async function selectThread(id){
      currentThreadId = id;
      try{
        const res = await fetch(`${WORKER_URL}/api/messages/${id}`);
        const msgs = await res.json();
        const container = document.getElementById('messages');
        container.innerHTML='';
        msgs.forEach(m=>appendMessage(m.content,m.role));
        const thread = threads.find(t=>t.id===id);
        document.getElementById('currentTitle').textContent = thread?.title || 'Conversation';
        document.getElementById('currentSubtitle').textContent = `${msgs.length} messages`;
        await loadThreads();
      }catch(e){ console.error('Error loading thread messages',e); }
    }

    async function sendMessage(){
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if(!text || !currentThreadId) return;
      appendMessage(text,'user');
      input.value='';
      const loadingMsg = appendMessage('Prism AI is thinking...','assistant');

      try{
        const res = await fetch(`${WORKER_URL}/api/chat`,{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threadId:currentThreadId,message:text})
        });
        const data = await res.json();
        loadingMsg.textContent = data.reply || "Sorry, I couldn't process that.";
        await loadThreads();
      }catch(err){ loadingMsg.textContent = '❌ Failed to reach AI backend.'; }
    }

    function appendMessage(text,role){
      const container = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      // simple markdown-like code block highlight (very small)
      if(typeof text === 'string' && text.includes('```')){
        const parts = text.split('```');
        parts.forEach((p,i)=>{
          if(i%2===1){ const pre = document.createElement('pre'); pre.style.background='rgba(0,0,0,0.12)'; pre.style.padding='8px'; pre.style.borderRadius='8px'; pre.textContent = p; msg.appendChild(pre); }
          else msg.appendChild(document.createTextNode(p));
        });
      } else {
        msg.textContent = text;
      }
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }

    /* --- Respect reduced motion by disabling animations when user requests --- */
    const media = window.matchMedia('(prefers-reduced-motion: reduce)');
    if(media.matches){ document.documentElement.style.setProperty('--anim-speed', '0'); }

    init();
  </script>
</body>
</html>
